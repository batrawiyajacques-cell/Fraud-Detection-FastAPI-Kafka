services:
  # 1. Base de données PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: MonSuperPassword2026
      POSTGRES_DB: tfc_fraud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tfc_fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Broker Apache Kafka (Version Confluent KRaft Stable)
  kafka_broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka_broker:9094,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9094,OUTSIDE://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_broker:9093
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. API Gateway (FastAPI)
  api_gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    container_name: fraud_api_gateway
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=tfc_fraud_db
      - DB_USER=admin
      - DB_PASS=MonSuperPassword2026
      - KAFKA_BROKER=kafka_broker:9094
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka_broker:
        condition: service_healthy

  # 4. Worker de Traitement et Inférence IA (ML Consumer)
  ml_consumer:
    build:
      context: .
      dockerfile: ./ml_consumer/Dockerfile
    container_name: fraud_ml_consumer
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=tfc_fraud_db
      - DB_USER=admin
      - DB_PASS=MonSuperPassword2026
      - KAFKA_BROKER=kafka_broker:9094
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka_broker:
        condition: service_healthy

  # 5. Application de Supervision (Streamlit)
  dashboard:
    build:
      context: .
      dockerfile: ./Dockerfile.dashboard
    container_name: fraud_dashboard
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=tfc_fraud_db
      - DB_USER=admin
      - DB_PASS=MonSuperPassword2026
      - KAFKA_BROKER=kafka_broker:9094
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka_broker:
        condition: service_healthy

  # 6. Webhook de Réception Banque Partenaire
  client_webhook:
    build:
      context: .
      dockerfile: ./client_api/Dockerfile
    container_name: fraud_client_webhook
    ports:
      - "8001:8001"
    restart: always

  # 7. Robot Simulateur de Flux Mixte (Variable d'environnement ajoutée)
  simulateur_flux:
    build:
      context: .
      dockerfile: Dockerfile.lanceur
    container_name: fraud_simulator
    restart: on-failure
    environment:
      - URL_API=http://api_gateway:8000/v1/transactions
    depends_on:
      api_gateway:
        condition: service_started

volumes:
  postgres_data:
